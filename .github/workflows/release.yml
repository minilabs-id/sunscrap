name: Release

# Rilis sunscrap ke GitHub Releases (Windows, NSIS).
# - Push tag "v*"  → rilis langsung (artefak dari build CI, tidak dari mesin lokal)
# - workflow_dispatch → build verifikasi "upload artifacts only" (tanpa rilis)
#
# Signing (SignPath Foundation): aktifkan setelah approval — lihat README → "Tanda tangan kode".
# Saat belum di-sign, installer v1.0.0 tidak ditandatangani (SAC/SmartScreen akan memperingatkan);
# itu BUKAN konfigurasi akhir — ikuti § Tanda tangan kode untuk meng-aktifkannya.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build saja (unggah artifacts, jangan buat rilis)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cache binary Electron & toolchain (NSIS/winCodeSign) agar tidak mengunduh ulang
      # setiap run — mengurangi risiko 504/timeout saat server GitHub sibuk.
      - name: Cache Electron & electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: npm ci

      - run: npm test # gagal → tidak rilis

      # Signing (SignPath Foundation) — uncomment setelah approval (butuh secrets SIGNPATH_*):
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: sunscrap
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ...   # lihat docs SignPath untuk integrasi CI

      - name: Build & publish installer (dengan retry)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo ">> electron-builder attempt $attempt/3"
            if npx electron-builder --win nsis --publish always; then
              echo ">> build & publish sukses"
              exit 0
            fi
            echo ">> attempt $attempt gagal — menunggu 15 detik sebelum coba lagi"
            sleep 15
          done
          echo ">> gagal setelah 3 percobaan"
          exit 1

      - run: npx electron-builder --win nsis --publish never
        if: github.event_name == 'workflow_dispatch'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: sunscrap-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
